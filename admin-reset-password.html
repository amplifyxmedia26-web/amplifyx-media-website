
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Admin Password | AmplifyX Media</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #171a30;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border: 1px solid #e1e5ed;
      border-radius: 20px;
      box-shadow: 0 12px 35px #10152a0d;
    }
    .brand { font-weight: 700; font-size: 20px; }
    .sub { color: #647087; font-size: 11px; letter-spacing: 2px; margin-top: 5px; }
    h1 { font-size: 27px; margin: 30px 0 10px; }
    p { color: #59657b; line-height: 1.5; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 18px 0 8px; }
    input {
      width: 100%; padding: 13px; border: 1px solid #d9deea;
      border-radius: 9px; font-size: 15px;
    }
    button {
      width: 100%; margin-top: 22px; padding: 14px;
      border: 0; border-radius: 9px; background: #171a30;
      color: white; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { margin-top: 16px; overflow-wrap: anywhere; }
    .success { color: #167448; }
    .error { color: #b42318; }
    a { color: #3348a5; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">AmplifyX Media</div>
    <div class="sub">CREATOR ADMIN PANEL</div>

    <h1>Reset password</h1>
    <p>Choose a new password for your authorized administrator account.</p>

    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8"
        autocomplete="new-password" required
        placeholder="Enter new password">

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="8"
        autocomplete="new-password" required
        placeholder="Enter password again">

      <button id="submitButton" type="submit">Update password</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="/admin">Return to admin login</a></p>
  </main>

  <script>
    const SUPABASE_URL = 'https://syymzdqavblqleiwhtkq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_sip04Xtymaa0fRGFp6X6KQ_01d6BDj5';

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById('resetForm');
    const button = document.getElementById('submitButton');
    const message = document.getElementById('message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    // Exchange a PKCE recovery code if one is present in the URL.
    async function prepareRecovery() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      if (code) {
        const { error } = await client.auth.exchangeCodeForSession(code);
        if (error) throw error;

        // Remove the one-time code from the address bar.
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      const hashParams = new URLSearchParams(
        window.location.hash.replace(/^#/, '')
      );

      if (hashParams.get('error_description')) {
        throw new Error(
          hashParams.get('error_description').replace(/\+/g, ' ')
        );
      }

      const { data, error } = await client.auth.getSession();
      if (error) throw error;

      if (!data.session) {
        throw new Error(
          'No recovery session found. Request a new password recovery email and open its link in this browser.'
        );
      }

      const email = data.session.user.email?.toLowerCase();
      if (email !== 'contact@amplifyxmedia.com') {
        await client.auth.signOut();
        throw new Error('This recovery link is not for the authorized admin account.');
      }
    }

    let recoveryReady = false;

    prepareRecovery()
      .then(() => {
        recoveryReady = true;
        showMessage('Recovery verified. Enter your new password.', 'success');
      })
      .catch(error => {
        showMessage(error.message || 'Could not verify the recovery link.', 'error');
        button.disabled = true;
      });

    form.addEventListener('submit', async event => {
      event.preventDefault();

      if (!recoveryReady) {
        showMessage('Please wait while we verify your recovery link.', 'error');
        return;
      }

      const password = document.getElementById('password').value;
      const confirmation = document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        showMessage('Use at least 8 characters for your password.', 'error');
        return;
      }

      if (password !== confirmation) {
        showMessage('The passwords do not match.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Updating...';

      try {
        const { data, error } = await client.auth.updateUser({ password });

        if (error) throw error;

        if (data.user?.email?.toLowerCase() !== 'contact@amplifyxmedia.com') {
          throw new Error('Unexpected account. Please contact your administrator.');
        }

        await client.auth.signOut();
        form.reset();
        showMessage(
          'Password updated successfully. You can now return to the admin login and sign in with your new password.',
          'success'
        );
      } catch (error) {
        showMessage(error.message || 'Password update failed. Request a new recovery link.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
